name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ clang \
            python3-pip \
            libgtest-dev libgmock-dev \
            shfmt shellcheck
          python3 -m pip install --upgrade pip
          python3 -m pip install gcovr

      - name: Configure unit tests (CMake)
        run: |
          CXX=$([ "${{ matrix.compiler }}" = "gcc" ] && echo g++ || echo clang++)
          rm -rf tests/unit/build
          mkdir -p tests/unit/build
          cd tests/unit/build

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake .. -G Ninja \
              -DCMAKE_CXX_STANDARD=17 \
              -DCMAKE_CXX_COMPILER=${CXX} \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
              -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          else
            cmake .. -G Ninja \
              -DCMAKE_CXX_STANDARD=17 \
              -DCMAKE_CXX_COMPILER=${CXX} \
              -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build unit tests
        run: |
          cd tests/unit/build
          cmake --build . -j

      - name: Run unit tests
        run: |
          cd tests/unit/build
          ctest --output-on-failure

      - name: Coverage summary (gcovr, GCC only)
        if: matrix.compiler == 'gcc'
        run: |
          gcovr -r . tests/unit/build \
            --exclude '.*(lib|external|mock|tests).*' \
            --print-summary \
            --fail-under-line 70

      - name: Check shell formatting (shfmt)
        run: shfmt -d . || true

      - name: Lint shell scripts (ShellCheck)
        run: |
          SCRIPTS=$(git ls-files '*.sh' || true)
          [ -z "$SCRIPTS" ] || shellcheck $SCRIPTS || true
